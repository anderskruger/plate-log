<title>Quest Mode</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Plate Log's dark phone column. Each quest is a parchment scroll with a floating gold "!" above it,
   the hero's level and XP sit in an MMO-style bar at the bottom, and words are kept to the objective and the reward.
   Deliberately dark-only, like Plate Log. */
:root {
  --floor: #121317;
  --raised: #1c1e24;
  --raised-2: #262932;
  --line: #30343f;
  --chalk: #eeeae1;
  --dim: #9a9ca6;
  --faint: #5d616c;
  --red: #ec4c4c; --blue: #3f8cfb; --yellow: #f3c233;
  --gold: #f6c744;          /* the quest "!" and XP */
  --gold-deep: #b8860f;
  --parch: #ecdcb4;         /* the scroll */
  --parch-edge: #c9ad73;
  --ink: #3a2914;           /* brown ink on parchment */
  --seal: #9b2f25;          /* wax-seal red buttons */
  --arcane: #a17cff;        /* quest mode's colour in the calendar */
  --font-display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-lore: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-caps: "IM Fell English SC", "IM Fell English", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; color: var(--chalk); font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  background: radial-gradient(ellipse at 50% -10%, #2a2416 0, transparent 55%), var(--floor);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--floor); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.app {
  max-width: 440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 130px;
  display: flex; flex-direction: column; gap: 22px;
}
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.meta { color: var(--dim); font-size: 13px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
.lore { font-family: var(--font-lore); }
.caps { font-family: var(--font-caps); letter-spacing: 0.04em; }

.topbar { display: flex; align-items: center; gap: 10px; }
.topbar .grow { flex: 1; min-width: 0; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: 0.02em; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--raised); color: var(--dim); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* chunky game buttons */
.btn { height: 54px; border-radius: 12px; font-weight: 700; font-size: 17px; letter-spacing: 0.02em; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; transition: transform 0.08s; }
.btn:active { transform: translateY(2px); }
.btn-gold { background: linear-gradient(#ffdc6a, #e3a91d); color: #2b1c04; box-shadow: inset 0 1px 0 #fff4bf, 0 3px 0 #8f660b, 0 6px 18px #f6c74433; }
.btn-seal { background: linear-gradient(#b23a2e, #82261e); color: #f8e8c6; box-shadow: inset 0 1px 0 #d8685c, 0 3px 0 #551711; font-family: var(--font-caps); font-weight: 400; font-size: 21px; letter-spacing: 0.06em; }
.btn-ghost { background: var(--raised-2); color: var(--chalk); box-shadow: 0 3px 0 #0d0e11; }

/* the quest marker: a floating gold "!" (and "?" when ready to turn in), drawn as SVG */
.marker { display: block; filter: drop-shadow(0 0 10px #f6c74488); }
.marker.bob { animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }

/* home */
.board { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 30px 20px 22px; border-radius: 22px; text-align: center;
  background: radial-gradient(ellipse at 50% 0%, #3a2f17 0, var(--raised) 65%); border: 1px solid #4a3d22; }
.board h2 { font-family: var(--font-caps); font-size: 40px; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 #0008; }
.board p { margin: -8px 0 0; color: var(--dim); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; padding: 5px; border-radius: 14px; background: #0e0f12; }
.seg button { height: 40px; border-radius: 10px; color: var(--dim); font-weight: 600; }
.seg button.on { background: var(--raised-2); color: var(--gold); box-shadow: inset 0 0 0 1px #6b5524; }
.board .btn { width: 100%; }
.slim { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--raised); }
.slim .grow { flex: 1; min-width: 0; }
.plate { width: 30px; height: 30px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, var(--floor) 0 15%, color-mix(in srgb, var(--c) 55%, #000) 16% 22%, var(--c) 23% 78%, color-mix(in srgb, var(--c) 70%, #000) 79% 82%, var(--c) 83%); }
.c-red { --c: var(--red); } .c-blue { --c: var(--blue); } .c-yellow { --c: var(--yellow); }

/* hero: portrait ring with the level, and a segmented XP bar */
.hero { display: flex; align-items: center; gap: 12px; width: 100%; }
.portrait { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle, #2d2611, #15130c); box-shadow: 0 0 0 3px var(--gold-deep), 0 0 0 5px #3b2e10, 0 4px 12px #0009; }
.portrait b { font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--gold); line-height: 1; }
.xp { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; text-align: left; }
.xp-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
.xp-top b { color: var(--chalk); font-weight: 600; }
.xp-track { height: 12px; border-radius: 3px; background: #0b0c0f; box-shadow: inset 0 0 0 1px #3a3220; overflow: hidden; position: relative; }
.xp-track::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), #0b0c0fcc calc(10% - 1px) 10%); }
.xp-fill { height: 100%; background: linear-gradient(#ffe27a, #d9a21a); transition: width 0.9s cubic-bezier(.2,.8,.2,1); }
.xp-track.glow { box-shadow: inset 0 0 0 1px var(--gold), 0 0 14px #f6c744aa; }

/* session */
.timer-pill { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 20px; background: var(--raised); }
.hg { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--gold) var(--p, 0%), #2c2e36 0); }
.hg span { width: 24px; height: 24px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; }
.hg svg { width: 14px; height: 14px; color: var(--gold); }
.timer-pill b { font-family: var(--font-display); font-weight: 800; font-size: 20px; }

.quest-wrap { position: relative; padding-top: 72px; }
.quest-wrap .marker { position: absolute; left: 50%; top: 0; margin-left: -24px; z-index: 2; }
.scroll {
  position: relative; color: var(--ink); padding: 30px 22px 22px; border-radius: 4px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  background:
    radial-gradient(ellipse at 20% 15%, #f6ead0 0, transparent 50%),
    radial-gradient(ellipse at 85% 90%, #d8c18e 0, transparent 55%),
    var(--parch);
  box-shadow: inset 0 0 0 1px #b59a62, inset 0 0 0 6px var(--parch), inset 0 0 0 7px #a98b53, inset 0 0 50px #a8844b77, 0 16px 40px #000a;
}
.scroll::before, .scroll::after { content: ""; position: absolute; left: -9px; right: -9px; height: 16px; border-radius: 8px;
  background: linear-gradient(#8a6738, #573d1d 60%, #3e2a12); box-shadow: 0 3px 5px #0009; }
.scroll::before { top: -8px; } .scroll::after { bottom: -8px; }
.scroll.fresh { animation: unroll 0.55s cubic-bezier(.2,.9,.3,1.2); transform-origin: top; }
@keyframes unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 -20px 0); } }
.scroll.turnin { animation: turnin 0.5s ease-in forwards; }
@keyframes turnin { 35% { transform: scale(1.03); } to { transform: scale(0.85) translateY(-14px); opacity: 0; } }
.scroll.elite { box-shadow: inset 0 0 0 1px #b59a62, inset 0 0 0 6px var(--parch), inset 0 0 0 8px var(--gold-deep), inset 0 0 50px #a8844b77, 0 0 0 2px #f6c74455, 0 0 34px #f6c74455, 0 16px 40px #000a; }
.ribbon { position: absolute; top: 12px; right: -6px; background: linear-gradient(#ffd75e, #c48d14); color: #2b1c04; font-family: var(--font-caps); font-size: 13px; letter-spacing: 0.12em; padding: 3px 12px 3px 10px; box-shadow: 0 2px 4px #0006; }
.ribbon::after { content: ""; position: absolute; right: 0; bottom: -6px; border: 3px solid #7a560a; border-right-color: transparent; border-bottom-color: transparent; }
.q-title { font-family: var(--font-lore); font-size: 30px; line-height: 1.05; }
.orn { display: flex; align-items: center; gap: 10px; width: 100%; color: #8d6f3c; }
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #9c7e47, transparent); }
.orn svg { width: 14px; height: 14px; }
.objective { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.obj-row { display: flex; align-items: center; gap: 12px; text-align: left; }
.box { width: 26px; height: 26px; flex: none; border: 2px solid var(--ink); border-radius: 4px; display: grid; place-items: center; }
.box svg { width: 18px; height: 18px; color: #2f6b2a; opacity: 0; transform: scale(0.4); transition: 0.25s cubic-bezier(.2,.9,.3,1.6); }
.obj-row.done .box svg { opacity: 1; transform: none; }
.obj-name { flex: 1; min-width: 0; font-weight: 600; font-size: 18px; }
.obj-count { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 0.9; }
.obj-count small { font-size: 22px; opacity: 0.55; }
.obj-bar { height: 8px; border-radius: 4px; background: #c9b17e; overflow: hidden; }
.obj-bar div { height: 100%; width: 0; background: linear-gradient(#5a8a3c, #3c6a26); }
.how { margin: 0; font-size: 14px; color: #5b4627; font-style: italic; font-family: var(--font-lore); max-width: 32ch; }
.reward { display: flex; align-items: center; gap: 8px; font-family: var(--font-caps); font-size: 18px; }
.reward .num { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.gem { width: 18px; height: 18px; }
.bonus { font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #3a291433; }
.q-actions { width: 100%; display: grid; grid-template-columns: 1fr 54px; gap: 10px; }
.round { height: 54px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); border: 2px solid #a98b53; background: #e3cf9f; }
.round svg { width: 22px; height: 22px; }
.round:disabled { opacity: 0.35; cursor: default; }
.side-call { font-family: var(--font-caps); font-size: 18px; color: var(--seal); min-height: 1.2em; }

.stack { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--dim); }
.stack .mini { display: flex; }
.stack .mini span { width: 22px; height: 28px; border-radius: 2px; margin-left: -8px; background: linear-gradient(#e9d7ab, #cdb27a); box-shadow: 0 -3px 0 #6a4b24 inset, 0 3px 0 #6a4b24 inset, 0 2px 6px #0008; }
.stack .mini span:first-child { margin-left: 0; }
.stack b { color: var(--gold); }

.idle { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 0 8px; text-align: center; }
.idle .ring { width: 168px; height: 168px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--gold) var(--p, 0%), #24262d 0); box-shadow: 0 0 40px #f6c74422; }
.idle .ring > div { width: 150px; height: 150px; border-radius: 50%; background: var(--floor); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.idle .ring b { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; }
.idle p { margin: 0; color: var(--dim); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: linear-gradient(#17181dee, #0e0f12f7); backdrop-filter: blur(10px); border-top: 1px solid #3b3220;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.dock .hero { max-width: 440px; margin: 0 auto; }
.demo-btn { position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  height: 34px; padding: 0 12px; border-radius: 17px; background: var(--raised-2); color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; border: 1px dashed var(--faint); }

/* summary */
.victory { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px; }
.victory h2 { font-family: var(--font-caps); font-size: 44px; color: var(--gold); line-height: 1; text-shadow: 0 2px 0 #0008; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--raised); border-radius: 14px; padding: 14px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; border: 1px solid #2f2a1d; }
.tile b { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1; }
.tile span { color: var(--dim); font-size: 12px; }
.loot { display: flex; flex-direction: column; gap: 6px; }
.loot div { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--raised); }
.loot .lore { font-size: 17px; flex: 1; min-width: 0; }
.loot .xpv { color: var(--gold); font-weight: 700; font-size: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 11px; color: var(--faint); font-weight: 600; padding-bottom: 4px; }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: var(--raised); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 2px; font-size: 13px; }
.day.out { background: transparent; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--chalk); }
.day.sel { background: var(--raised-2); }
.dots { display: flex; gap: 3px; height: 10px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
.qdot { font-family: var(--font-display); font-weight: 800; font-size: 13px; line-height: 1; color: var(--gold); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.entries { display: flex; flex-direction: column; gap: 8px; }
.entry { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--raised); }
.entry .grow { flex: 1; min-width: 0; }
.tag { font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }

/* overlays */
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -160%); transition: transform 0.4s cubic-bezier(.2,.9,.3,1.25), visibility 0.4s; visibility: hidden;
  z-index: 30; display: flex; align-items: center; gap: 10px; color: var(--ink); max-width: calc(100% - 32px);
  background: var(--parch); border-radius: 4px; padding: 8px 16px 8px 10px; box-shadow: inset 0 0 0 1px #b59a62, inset 0 0 20px #a8844b66, 0 10px 30px #000a; }
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast .lore { font-size: 20px; white-space: nowrap; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
.banner { position: fixed; z-index: 41; left: 0; right: 0; top: 30%; transform: translateY(-50%); pointer-events: none; text-align: center; animation: banner 1.7s ease-out forwards;
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 16px;
  background: linear-gradient(90deg, transparent, #0b0c0fee 18%, #0b0c0fee 82%, transparent); border-block: 1px solid #f6c74455; }
.banner .eyebrow { color: var(--gold); }
.banner .caps { font-size: 36px; line-height: 1.05; color: var(--gold); text-shadow: 0 2px 0 #3b2a0a; }
.banner .gain { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--chalk); text-shadow: 0 2px 8px #000; }
.banner .gain em { font-style: normal; color: var(--gold); font-size: 20px; margin-left: 6px; }
@keyframes banner { 0% { opacity: 0; transform: translateY(-50%) scaleY(0.2); } 14% { opacity: 1; transform: translateY(-50%) scaleY(1.08); } 24% { transform: translateY(-50%); } 78% { opacity: 1; } to { opacity: 0; transform: translateY(-70%); } }

.levelup { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; text-align: center; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, #3d3112, #0b0c0f 62%); background-color: #0b0c0f;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fadein 0.3s ease-out; }
@keyframes fadein { from { opacity: 0; } }
.levelup .rays { position: absolute; left: 50%; top: 42%; width: 700px; height: 700px; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(#f6c74424 0 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 0 28%, transparent 62%); mask: radial-gradient(circle, #000 0 28%, transparent 62%); animation: spin 20s linear infinite; pointer-events: none; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.levelup .inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.levelup .caps { font-size: 30px; color: var(--chalk); letter-spacing: 0.1em; }
.levelup .big { font-family: var(--font-display); font-weight: 800; font-size: 120px; line-height: 0.85; color: var(--gold); text-shadow: 0 4px 0 #6d4f0a, 0 0 40px #f6c74466; animation: pop 0.6s cubic-bezier(.2,.9,.3,1.5); }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } }
.levelup .harder { display: flex; gap: 8px; margin-top: 10px; }
.levelup .harder span { background: #ffffff10; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--dim); }
.levelup .harder b { display: block; color: var(--chalk); font-size: 16px; }

.sheet-bg { position: fixed; inset: 0; z-index: 25; background: #000b; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 440px; background: var(--raised); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 14px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-top: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { font-size: 20px; font-weight: 600; }
.sheet p { margin: 0; color: var(--dim); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 36px; padding: 0 12px; border-radius: 10px; background: var(--raised-2); color: var(--dim); font-weight: 600; font-size: 13px; }
.chip.on { background: var(--gold); color: #2b1c04; }
.lockcard { border-radius: 18px; background: #e9e6ef; color: #1b1b22; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.lockcard .t { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; min-width: 64px; }
.lockcard .grow { flex: 1; min-width: 0; font-size: 13px; }
.lockcard .grow b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lockcard button { background: var(--gold); color: #2b1c04; font-weight: 700; padding: 9px 14px; border-radius: 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<div class="app" id="app"></div>
<div class="dock" id="dock" hidden></div>
<button class="demo-btn" id="demo-btn" data-act="demo" hidden>Demo</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx"></canvas>
<div id="overlay"></div>

<script>
/* ---------- quests: 30–60 s of movement for the quiet moments in a game ---------- */
// amount = base + step per level above 1, capped at max. kind: reps or seconds; each: per side.

let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function bell(freq, at, dur = 1.2, vol = 0.18) {
  const a = audio(); if (!a || !prefs.sound) return;
  const t = a.currentTime + at;
  [[1, 1], [2.01, 0.35], [3.02, 0.12], [4.2, 0.06]].forEach(([m, v]) => {
    const o = a.createOscillator(); const g = a.createGain();
    o.type = 'sine'; o.frequency.value = freq * m;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur / m ** 0.3);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.1);
  });
}
function thump(at, vol = 0.35) {
  const a = audio(); if (!a || !prefs.sound) return;
  const t = a.currentTime + at; const o = a.createOscillator(); const g = a.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.25);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.35);
}
const N = f => 440 * 2 ** ((f - 69) / 12);   // MIDI note → Hz
const SOUND = {
  quest() { bell(N(79), 0, 1.4, 0.16); bell(N(86), 0.17, 1.8, 0.16); bell(N(91), 0.34, 1.2, 0.07); buzz([60, 80, 60]); },
  elite() { thump(0, 0.3); bell(N(74), 0, 1.4, 0.15); bell(N(79), 0.15, 1.4, 0.15); bell(N(86), 0.3, 2, 0.16); bell(N(91), 0.45, 1.6, 0.08); buzz([80, 60, 80, 60, 160]); },
  complete() { thump(0); [72, 76, 79, 84].forEach((n, i) => bell(N(n), 0.05 + i * 0.075, 1.3, 0.15)); bell(N(96), 0.38, 1.6, 0.06); buzz([30, 40, 90]); },
  coin() { bell(N(100), 0, 0.25, 0.035); },
  level() {

/* ---------- prototype clock: speed it up to see quests arrive ---------- */
const shown = new Set();
let speed = 1, simNow = Date.now(), lastReal = performance.now();
let sess = null, seq = 0, view = 'home', calMonth = new Date(todayStart), calSel = todayStart, summary = null, sheet = null;

function pickExercise(exclude = []) {
  const recent = sess ? [...sess.done, ...sess.quests].map(q => q.exId).slice(-4) : [];
  let pool = EX.filter(e => !recent.includes(e.id) && !exclude.includes(e.id) && e.cat !== (sess && sess.lastCat));
  if (!pool.length) pool = EX.filter(e => !exclude.includes(e.id));
  const w = e => CAT_WEIGHT[e.cat] / EX.filter(x => x.cat === e.cat).length;
  let r = Math.random() * pool.reduce((s, e) => s + w(e), 0);
  for (const e of pool) { r -= w(e); if (r <= 0) return e; }
  return pool[pool.length - 1];
}
function newQuest(forceElite) {
  const ex = pickExercise();
  const elite = forceElite || (ex.cat !== 'break' && Math.random() < ELITE_CHANCE);
  sess.lastCat = ex.cat;
  sess.quests.push({ id: ++seq, exId: ex.id, elite, amount: amountAt(ex, hero.level, elite), arrived: simNow, swapped: false, timer: null });
  elite ? SOUND.elite() : SOUND.quest();
  toast(`${markerSvg('!', 30)}<span class="lore">${ex.quest}</span>${elite ? '<span class="bonus" style="background:#b8860f33">Elite</span>' : ''}`);
  render();
}
function startSession() {
  audio(); SOUND.start();
  simNow = Date.now();
  sess = { start: simNow, realStart: Date.now(), interval: prefs.interval, nextAt: simNow + prefs.interval * 60000, quests: [], done: [], xp: 0, levelFrom: hero.level, lastCat: null };
  view = 'session'; render(); scrollTo(0, 0);
}
function complete(q) {
  const ex = exById(q.exId);
  const card = document.getElementById('scroll');
  const swift = simNow - q.arrived <= SWIFT_MS;
  const gain = CAT_XP[ex.cat] * (q.elite ? 2 : 1) + (swift ? SWIFT_XP : 0);
  sess.quests = sess.quests.filter(x => x !== q);
  sess.done.push({ ...q, at: simNow, gain, swift });
  sess.xp += gain;
  SOUND.complete();
  // tick the objective, then turn the scroll in
  const row = document.getElementById('obj-row'); if (row) row.classList.add('done');
  const cnt = document.getElementById('obj-count'); if (cnt && ex.kind === 'reps') cnt.innerHTML = `${q.amount}<small>/${q.amount}</small>`;
  const r = (card || $('#app')).getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + Math.min(r.height / 2, 200);
  showBanner(gain, swift, q.elite);
  if (!reduced) burst(x, y, q.elite ? 140 : 90);
  setTimeout(() => {
    if (card) card.classList.add('turnin');
    flyXp(x, y, gain, () => {
      const before = hero.level;
      hero.xp += gain;
      while (hero.xp >= xpNeed(hero.level)) { hero.xp -= xpNeed(hero.level); hero.level++; }
      save();
      paintHero(true);
      if (hero.level > before) setTimeout(() => levelUp(before, hero.level), 350);
    });
    setTimeout(render, 480);
  }, 380);
}
function swap(q) {
  const ex = pickExercise([q.exId]);
  q.exId = ex.id; q.amount = amountAt(ex, hero.level, q.elite); q.swapped = true; q.timer = null; shown.delete(q.id);
  render();
}
function startTimer(q) { audio(); q.timer = { start: performance.now(), total: totalSecs(q), sided: false, ticked: 0 }; render(); }
function endSession() {
  const entry = { kind: 'quest', at: sess.realStart, min: Math.max(1, Math.round((simNow - sess.start) / 60000)), done: sess.done.length, missed: sess.quests.length, xp: sess.xp, from: sess.levelFrom, to: hero.level };

const fx = document.getElementById('fx'); const ctx = fx.getContext('2d');

function showBanner(gain, swift, elite) {
  const b = document.createElement('div'); b.className = 'banner';
  b.innerHTML = `${elite ? '<div class="eyebrow">Elite</div>' : ''}<div class="caps">Quest complete!</div><div class="gain num">+${gain} XP${swift ? '<em>Swift!</em>' : ''}</div>`;

function burst(x, y, n, spread = 1) {
  const cols = ['#f6c744', '#ffe590', '#fff6d8', '#e0a91d'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 7) * spread;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, life: 1, decay: 0.012 + Math.random() * 0.012, size: 2 + Math.random() * 4, col: cols[i % cols.length], spin: Math.random() * 6, star: i % 3 === 0 });
  }

}
function flyXp(x, y, gain, done) {
  const bar = document.querySelector('#dock .xp-track');
  if (!bar || reduced) { done(); return; }
  const b = bar.getBoundingClientRect();
  const n = Math.min(14, Math.round(gain / 4));
  let left = n;
  for (let i = 0; i < n; i++) {
    parts.push({ orb: true, x: x + (Math.random() - 0.5) * 80, y: y + (Math.random() - 0.5) * 60, tx: b.left + b.width * (hero.xp / xpNeed(hero.level)), ty: b.top + b.height / 2,

      const cx = (p.x + p.tx) / 2, cy = Math.min(p.y, p.ty) - 120;   // arc up, then down into the bar
      const ox = (1 - e) ** 2 * p.x + 2 * (1 - e) * e * cx + e * e * p.tx, oy = (1 - e) ** 2 * p.y + 2 * (1 - e) * e * cy + e * e * p.ty;

    <div class="portrait"><b class="num" id="hero-level">${hero.level}</b></div>
    <div class="xp"><div class="xp-top"><span><b id="hero-rank">${rank(hero.level)}</b></span><span class="num" id="hero-xp">${hero.xp} / ${need} XP</span></div>
      <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:${hero.xp / need * 100}%"></div></div></div></div>`;
}
function paintHero(glow) {
  const need = xpNeed(hero.level);
  document.querySelectorAll('#xp-fill').forEach(f => { f.style.width = hero.xp / need * 100 + '%'; });
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('hero-level', hero.level); set('hero-rank', rank(hero.level)); set('hero-xp', `${hero.xp} / ${need} XP`);
  if (glow) { const t = document.querySelector('#dock .xp-track'); if (t) { t.classList.add('glow'); setTimeout(() => t.classList.remove('glow'), 700); } }
}

function screenHome() {
  return `
  <div class="topbar">
    <div class="grow brand">Plate Log</div>
    <button class="icon-btn" data-act="sound" aria-label="${prefs.sound ? 'Mute sounds' : 'Turn sounds on'}">${prefs.sound ? ICON.sound : ICON.mute}</button>
    <button class="icon-btn" data-act="calendar" aria-label="Calendar">${ICON.cal}</button>
  </div>
  <section class="board">
    ${markerSvg('!', 76, 'bob')}
    <h2>Quest Mode</h2>
    <p>A quest every ${prefs.interval} min while you play</p>
    <div class="seg" role="group" aria-label="Quest interval">${[15, 30, 45, 60].map(m => `<button class="${prefs.interval === m ? 'on' : ''}" data-act="interval" data-m="${m}">${m} min</button>`).join('')}</div>
    ${heroHtml()}
    <button class="btn btn-gold" data-act="start">Start quest mode</button>
  </section>
  <div class="slim c-yellow"><span class="plate"></span><div class="grow"><div class="eyebrow">Next workout</div><b>Shoulders + Legs</b></div></div>`;
}

function questScroll(q) {
  const ex = exById(q.exId); const t = q.timer;
  const fresh = !shown.has(q.id); shown.add(q.id);
  const waited = Math.floor((simNow - q.arrived) / 60000);
  const swift = simNow - q.arrived <= SWIFT_MS;
  const xp = CAT_XP[ex.cat] * (q.elite ? 2 : 1);
  const count = ex.kind === 'reps'
    ? `${0}<small>/${q.amount}</small>`
    : (t ? fmtClock((t.total - (performance.now() - t.start) / 1000) * 1000) : fmtClock(totalSecs(q) * 1000));
  return `<div class="quest-wrap">
    ${markerSvg(t ? '?' : '!', 64, 'bob')}
    <article class="scroll ${q.elite ? 'elite' : ''} ${fresh ? 'fresh' : ''}" id="scroll">
      ${q.elite ? '<span class="ribbon">Elite</span>' : ''}
      <h2 class="q-title">${ex.quest}</h2>
      <div class="orn">${ICON.flourish}</div>
      <div class="objective">
        <div class="obj-row" id="obj-row">
          <span class="box">${ICON.check}</span>
          <span class="obj-name">${ex.name}${ex.each ? ` <span style="font-weight:400;opacity:.7">each ${ex.each}</span>` : ''}</span>
          <span class="obj-count num" id="obj-count">${count}</span>
        </div>
        ${t ? `<div class="obj-bar"><div id="obj-bar"></div></div>` : ''}
      </div>
      ${t && ex.each ? `<div class="side-call" id="side-call">First side</div>` : ''}
      <p class="how">${ex.how}</p>
      <div class="reward">${ICON.gem}<span class="num">${xp} XP</span>${swift ? `<span class="bonus" id="swift-tag">+${SWIFT_XP} swift</span>` : waited ? `<span class="bonus">${fmtDur(waited)}</span>` : ''}</div>
      <div class="q-actions">
        ${ex.kind === 'time'
          ? (t ? `<button class="btn btn-seal" data-act="complete" data-q="${q.id}">Turn in early</button>` : `<button class="btn btn-seal" data-act="timer" data-q="${q.id}">Begin</button>`)
          : `<button class="btn btn-seal" data-act="complete" data-q="${q.id}">Complete</button>`}
        ${t ? `<button class="round" data-act="stop" data-q="${q.id}" aria-label="Stop the timer">${ICON.stop}</button>`
            : `<button class="round" data-act="swap" data-q="${q.id}" aria-label="Swap for another exercise" ${q.swapped ? 'disabled' : ''}>${ICON.swap}</button>`}
      </div>
    </article>
  </div>`;
}

function screenSession() {
  const [first, ...rest] = sess.quests;
  return `
  <div class="topbar">
    <button class="btn btn-ghost" style="height:40px;font-size:14px;padding:0 14px" data-act="end">End</button>
    <div class="grow"></div>
    <div class="timer-pill" title="Next quest"><span class="hg" id="hg"><span>${ICON.hourglass}</span></span><b class="num" id="next-clock">${fmtClock(sess.nextAt - simNow)}</b></div>
    <button class="icon-btn" data-act="sound" aria-label="${prefs.sound ? 'Mute sounds' : 'Turn sounds on'}">${prefs.sound ? ICON.sound : ICON.mute}</button>
  </div>
  ${first ? questScroll(first) : `<div class="idle"><div class="ring" id="idle-ring"><div><span class="eyebrow">Next quest</span><b class="num" id="idle-clock">${fmtClock(sess.nextAt - simNow)}</b></div></div><p>Go play. It'll call you.</p></div>`}
  ${rest.length ? `<div class="stack"><span class="mini">${rest.slice(0, 3).map(() => '<span></span>').join('')}</span><span><b class="num">${rest.length}</b> more waiting</span></div>` : ''}`;
}

function screenSummary() {
  const e = summary.entry;
  return `
  <div class="victory">${markerSvg('?', 70, 'bob')}<h2>Victory</h2><span class="meta">${fmtDur(e.min)} played · saved to your calendar</span></div>
  <div class="tiles">
    <div class="tile"><b class="num">${e.done}</b><span>Quests</span></div>
    <div class="tile"><b class="num" style="color:var(--gold)">+${e.xp}</b><span>XP</span></div>
    <div class="tile"><b class="num">${e.missed}</b><span>Left waiting</span></div>
  </div>
  ${summary.done.length ? `<div class="loot">${summary.done.map(q => `<div>${ICON.gem}<span class="lore">${exById(q.exId).quest}</span>${q.elite ? '<span class="bonus" style="background:#b8860f33;color:var(--gold)">Elite</span>' : ''}<span class="xpv num">+${q.gain}</span></div>`).join('')}</div>` : ''}
  <div class="row2"><button class="btn btn-ghost" data-act="home">Done</button><button class="btn btn-gold" data-act="calendar">Calendar</button></div>`;
}

function screenCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const startPad = (new Date(y, m, 1).getDay() + 6) % 7; const days = new Date(y, m + 1, 0).getDate();
  const byDay = {};
  allEntries().forEach(e => { const d = new Date(e.at); d.setHours(0, 0, 0, 0); (byDay[+d] ||= []).push(e); });
  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push('<div class="day out"></div>');
  for (let d = 1; d <= days; d++) {
    const t = +new Date(y, m, d); const es = byDay[t] || [];
    cells.push(`<button class="day ${t === todayStart ? 'today' : ''} ${t === calSel ? 'sel' : ''}" data-act="day" data-t="${t}" aria-label="${fmtDay(t)}, ${es.length} entries">
      <span class="num">${d}</span><span class="dots">${es.map(e => e.kind === 'quest' ? '<span class="qdot">!</span>' : `<span class="dot c-${WORKOUTS[e.w].c}"></span>`).join('')}</span></button>`);
  }
  const sel = (byDay[calSel] || []).sort((a, b) => a.at - b.at);
  return `
  <div class="topbar"><button class="icon-btn" data-act="home" aria-label="Back">${ICON.back}</button><div class="grow brand">Calendar</div></div>
  <div class="cal-head"><button class="icon-btn" data-act="month" data-d="-1" aria-label="Previous month">${ICON.prev}</button><h2>${MON[m]} ${y}</h2><button class="icon-btn" data-act="month" data-d="1" aria-label="Next month">${ICON.next}</button></div>
  <div class="cal">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<div class="dow">${d}</div>`).join('')}${cells.join('')}</div>
  <div class="legend"><span><span class="dot c-red"></span>Chest</span><span><span class="dot c-blue"></span>Back</span><span><span class="dot c-yellow"></span>Legs</span><span><span class="qdot">!</span>Quest mode</span></div>
  <div class="entries">${sel.length ? sel.map(e => e.kind === 'quest'
      ? `<div class="entry">${markerSvg('!', 30)}<div class="grow"><b>Quest mode</b>${e.example ? '<span class="tag">example</span>' : ''}<div class="meta">${fmtDur(e.min)} · ${e.done} quests · +${e.xp} XP</div></div></div>`
      : `<div class="entry c-${WORKOUTS[e.w].c}"><span class="plate"></span><div class="grow"><b>${WORKOUTS[e.w].name}</b>${e.example ? '<span class="tag">example</span>' : ''}<div class="meta">${fmtDur(e.min)} · ${e.sets} sets</div></div></div>`).join('')
    : `<p class="meta" style="margin:0">${fmtDay(calSel)}: nothing logged.</p>`}</div>`;
}

function sheetHtml() {
  if (sheet === 'end') return `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-label="End quest mode">
      <h3>End quest mode?</h3>
      ${sess.quests.length ? `<p>${sess.quests.length} quest${sess.quests.length === 1 ? '' : 's'} still waiting.</p>` : ''}
      <div class="row2"><button class="btn btn-ghost" data-act="close-sheet">Keep playing</button><button class="btn btn-gold" data-act="end-yes">End session</button></div></div></div>`;
  if (sheet === 'demo') {
    const q = sess && sess.quests[0]; const ex = q && exById(q.exId);
    return `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-label="Prototype controls">
      <h3>Prototype controls</h3>
      <div class="chips">${[[1, 'Real time'], [60, '1 min = 1 s'], [600, '10 min = 1 s']].map(([s, l]) => `<button class="chip ${speed === s ? 'on' : ''}" data-act="speed" data-s="${s}">${l}</button>`).join('')}</div>
      <div class="chips"><button class="chip" data-act="summon">Quest now</button><button class="chip" data-act="summon-elite">Elite quest now</button></div>
      <div class="eyebrow">Lock screen in the real app</div>
      <div class="lockcard"><span class="t num">${q ? '!' : fmtClock(sess.nextAt - simNow)}</span>
        <div class="grow">${q ? `<b>${ex.quest}</b>${ex.name} · ${ex.kind === 'reps' ? q.amount : totalSecs(q) + ' s'}` : '<b>Next quest</b>Quest mode'}</div>
        ${q ? `<button data-act="complete" data-q="${q.id}">Done</button>` : ''}</div>
      <button class="btn btn-ghost" data-act="close-sheet">Close</button></div></div>`;
  }
  return '';
}

function render() {
  $('#app').innerHTML = { home: screenHome, session: screenSession, summary: screenSummary, calendar: screenCalendar }[view]();
  const dock = $('#dock'); dock.hidden = view !== 'session';
  if (view === 'session') dock.innerHTML = heroHtml();
  $('#demo-btn').hidden = view !== 'session';
  const lvl = $('#overlay .levelup');
  $('#overlay').innerHTML = sheet ? sheetHtml() : lvl ? lvl.outerHTML : '';
  tick();
}

let toastT = null;
function toast(html) { const t = $('#toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }

function tick() {
  const r = performance.now(); simNow += (r - lastReal) * speed; lastReal = r;
  if (!sess) return;
  let guard = 0;
  while (simNow >= sess.nextAt && guard++ < 12) { sess.nextAt += sess.interval * 60000; newQuest(); }
  const left = sess.nextAt - simNow; const p = (1 - left / (sess.interval * 60000)) * 100 + '%';
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('next-clock', fmtClock(left)); set('idle-clock', fmtClock(left));
  ['hg', 'idle-ring'].forEach(id => { const el = document.getElementById(id); if (el) el.style.setProperty('--p', p); });
  const q = sess.quests[0];
  if (q && !q.timer && simNow - q.arrived > SWIFT_MS && document.getElementById('swift-tag')) render();   // swift bonus ran out
  if (q && q.timer) {
    const t = q.timer; const ex = exById(q.exId);
    const el = (r - t.start) / 1000; const remain = t.total - el;
    set('obj-count', fmtClock(remain * 1000));
    const bar = document.getElementById('obj-bar'); if (bar) bar.style.width = Math.min(100, el / t.total * 100) + '%';
    if (ex.each && !t.sided && el >= t.total / 2) { t.sided = true; SOUND.side(); set('side-call', 'Switch sides!'); }
    const sec = Math.ceil(remain);
    if (sec <= 3 && sec > 0 && t.ticked !== sec) { t.ticked = sec; SOUND.tick(); }
    if (remain <= 0) { q.timer = null; complete(q); }
  }
}
setInterval(tick, 200);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'close-sheet' && t.classList.contains('sheet-bg') && e.target !== t) return;   // taps inside the sheet
  const q = t.dataset.q && sess ? sess.quests.find(x => x.id === +t.dataset.q) : null;
  switch (act) {
    case 'start': startSession(); break;
    case 'interval': prefs.interval = +t.dataset.m; save(); render(); break;
    case 'sound': prefs.sound = !prefs.sound; save(); if (prefs.sound) { audio(); SOUND.tick(); } render(); break;
    case 'calendar': {   // after a session: today; otherwise the month with the most recent entries
      const latest = view === 'summary' ? todayStart : Math.max(...allEntries().map(x => x.at));
      const d = new Date(latest); d.setHours(0, 0, 0, 0);
      view = 'calendar'; calSel = +d; calMonth = new Date(d.getFullYear(), d.getMonth(), 1); render(); scrollTo(0, 0); break;
    }
    case 'home': view = sess ? 'session' : 'home'; render(); scrollTo(0, 0); break;
    case 'month': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +t.dataset.d, 1); render(); break;
    case 'day': calSel = +t.dataset.t; render(); break;
    case 'complete': if (q) { if (sheet) { sheet = null; render(); } complete(q); } break;
    case 'swap': if (q && !q.swapped) swap(q); break;
    case 'timer': if (q) startTimer(q); break;
    case 'stop': if (q) { q.timer = null; render(); } break;
    case 'demo': sheet = 'demo'; render(); break;
    case 'speed': speed = +t.dataset.s; render(); break;
    case 'summon': audio(); sheet = null; newQuest(); break;
    case 'summon-elite': audio(); sheet = null; newQuest(true); break;
    case 'end': sheet = 'end'; render(); break;
    case 'close-sheet': sheet = null; render(); break;
    case 'end-yes': endSession(); break;
    case 'close-level': $('#overlay').innerHTML = ''; break;
  }
});
render();
</script>
