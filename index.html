<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Log</title>
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; session screen takes on the workout's bumper-plate colour; rest clock docks at the bottom. Deliberately dark-only (gym use, high contrast). */
:root {
  --floor: #14161b;      /* rubber gym floor */
  --raised: #1d2027;
  --raised-2: #272b34;
  --line: #313643;
  --chalk: #eeeae1;      /* chalk white text */
  --dim: #999ba5;
  --faint: #5e626d;
  /* competition bumper plates: 25 red, 20 blue, 15 yellow, 10 green */
  --red: #ec4c4c;
  --blue: #3f8cfb;
  --yellow: #f3c233;
  --green: #3db46a;
  --orange: #f0883a;
  --ink: #101114;        /* text on plate colours */
  --wk: var(--chalk);
  --font-display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--floor);
  color: var(--chalk);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--floor);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.app {
  max-width: 440px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 170px;
  display: flex; flex-direction: column; gap: 18px;
}
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); letter-spacing: 0.01em; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* plate disc */
.plate {
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  background:
    radial-gradient(circle, var(--floor) 0 15%, color-mix(in srgb, var(--c) 55%, #000) 16% 22%, var(--c) 23% 78%, color-mix(in srgb, var(--c) 70%, #000) 79% 82%, var(--c) 83%);
}
.plate.lg { width: 72px; height: 72px; }
.plate.sm { width: 14px; height: 14px; background: var(--c); }
.c-red { --c: var(--red); } .c-blue { --c: var(--blue); } .c-yellow { --c: var(--yellow); }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: 0.02em; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--raised); color: var(--dim); }
.icon-btn svg { width: 20px; height: 20px; }

/* cards */
.next-card {
  background: var(--raised); border-radius: 20px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
  border: 1px solid var(--line);
}
.next-head { display: flex; gap: 14px; align-items: center; }
.next-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; }
.meta { color: var(--dim); font-size: 13px; }
.len-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--raised-2); }
.len-toggle button { height: 40px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--dim); }
.len-toggle button.on { background: var(--c, var(--chalk)); color: var(--ink); }
.ex-preview { color: var(--dim); font-size: 13px; line-height: 1.5; }
.btn {
  height: 52px; border-radius: 14px; padding: 0 20px;
  font-weight: 600; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: var(--c, var(--chalk)); color: var(--ink); }
.btn-ghost { background: var(--raised-2); color: var(--chalk); }
.btn-danger { background: transparent; color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); }
.btn-block { width: 100%; }
.workout-row {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  background: var(--raised); border-radius: 16px; padding: 14px; border: 1px solid transparent;
}
.workout-row .grow { flex: 1; min-width: 0; }
.workout-row h3 { font-family: var(--font-display); font-weight: 800; font-size: 22px; text-transform: uppercase; line-height: 1.05; }
.chev { color: var(--faint); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.tip {
  border: 1px dashed var(--line); border-radius: 16px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 6px; color: var(--dim); font-size: 13px;
}
.tip q { color: var(--chalk); font-style: normal; }
.resume {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: color-mix(in srgb, var(--c) 18%, var(--raised)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  border-radius: 16px; padding: 14px;
}
.resume .grow { flex: 1; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--c); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

/* preview */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 14px; height: 40px; }
.hero { display: flex; gap: 16px; align-items: center; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 0.95; text-transform: uppercase; }
.plan-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.plan-item { display: flex; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.howto {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 4px;
  font-size: 12px; font-weight: 600; color: var(--dim); text-decoration: none;
  padding: 4px 9px 4px 7px; border-radius: 999px; background: var(--raised-2);
}
.howto svg { width: 13px; height: 13px; color: var(--red); }
.howto:active { background: var(--line); }
.howto:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.plan-item .r { text-align: right; color: var(--dim); font-size: 13px; white-space: nowrap; }
.plan-item b { font-weight: 600; }
.sample-note { font-size: 12px; color: var(--faint); }

/* session */
.session-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--floor); margin-inline: -4px; padding: 6px 4px 10px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 2px solid var(--wk);
}
.session-bar .grow { flex: 1; min-width: 0; }
.session-bar h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-bar .meta { font-size: 12px; }
.finish-btn { height: 40px; padding: 0 16px; border-radius: 12px; background: var(--raised-2); font-weight: 600; font-size: 14px; }
/* exercise strip: one segment per exercise, width by set count; tap to look ahead */
.strip-wrap { display: flex; flex-direction: column; gap: 4px; margin-top: -8px; }
.strip { display: flex; gap: 4px; }
.seg { flex: var(--n) 1 0; height: 26px; display: flex; align-items: center; min-width: 0; }
.seg i { display: block; position: relative; width: 100%; height: 6px; border-radius: 3px; background: var(--raised-2); overflow: hidden; transition: height 0.15s; }
.seg i b { position: absolute; inset: 0 auto 0 0; background: var(--wk); border-radius: 3px; }
.seg.on i { height: 12px; box-shadow: inset 0 0 0 1.5px var(--wk); }
.strip-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }

/* focus card: the one set you're about to do */
.focus { display: flex; flex-direction: column; gap: 14px; }
.focus-eyebrow { color: var(--wk); }
.focus-eyebrow.ahead { color: var(--dim); }
.focus-name { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 0.92; text-transform: uppercase; margin-top: 4px; }
.focus-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.focus-meta .howto { margin: 0 0 0 auto; }
.sdot {
  width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line);
  font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--faint);
  display: grid; place-items: center;
}
.sdot.done { background: color-mix(in srgb, var(--wk) 24%, var(--raised)); border-color: transparent; color: var(--wk); }
.sdot.sel { border-color: var(--wk); color: var(--chalk); box-shadow: 0 0 0 3px color-mix(in srgb, var(--wk) 25%, transparent); }
.sdot.done.sel { color: var(--wk); }
.focus-last { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); }
.focus-last b { color: var(--chalk); font-weight: 600; }
.focus .wheel { max-width: 250px; }
.focus .wheel-center { box-shadow: 0 0 0 6px var(--floor), 0 8px 24px rgb(0 0 0 / 0.5); }
.focus-links { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.chip-btn { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--raised-2); font-size: 13px; font-weight: 600; }
.chip-btn.accent { background: var(--wk); color: var(--ink); }
.all-done {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px;
  background: color-mix(in srgb, var(--wk) 16%, var(--raised)); border: 1px solid color-mix(in srgb, var(--wk) 45%, transparent);
}
.all-done .grow { flex: 1; }

/* up next */
.upnext { display: flex; flex-direction: column; gap: 8px; }
.up-row { box-sizing: border-box; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; background: var(--raised); border-radius: 14px; }
.up-row .grow { flex: 1; min-width: 0; }
.up-row b { font-weight: 600; }
.up-row .r { font-family: var(--font-display); font-weight: 800; font-size: 22px; white-space: nowrap; }
.up-row .r small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--dim); }
.up-row.same { background: transparent; border: 1px dashed var(--line); }

/* overview sheet */
.ov-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ov-row .grow { flex: 1; min-width: 0; }
.ov-sets { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--faint); margin-top: 2px; }
.ov-sets .d { color: var(--wk); }

/* dock + rest clock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--floor) 70%, transparent);
  padding-top: 18px;
}
.dock-inner { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--raised); border-radius: 16px; padding: 4px; gap: 4px; }
.tab { height: 46px; border-radius: 12px; font-weight: 600; font-size: 14px; color: var(--dim); display: flex; align-items: center; justify-content: center; gap: 8px; }
.tab svg { width: 18px; height: 18px; }
.tab.on { background: var(--raised-2); color: var(--chalk); }
.rest {
  --stage: var(--dim);
  background: var(--raised); border-radius: 18px; padding: 12px 14px 12px;
  border: 1px solid color-mix(in srgb, var(--stage) 55%, var(--line));
  display: flex; flex-direction: column; gap: 8px;
  transition: border-color 0.3s;
}
.rest-row { display: flex; align-items: center; gap: 12px; }
.rest-clock { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 0.9; color: var(--stage); min-width: 3.1ch; transition: color 0.3s; }
.rest-txt { flex: 1; min-width: 0; }
.rest-label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stage); }
.rest-next { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest-next b { color: var(--chalk); font-weight: 600; }
.sound-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--raised-2); display: grid; place-items: center; color: var(--dim); flex: none; }
.sound-btn svg { width: 20px; height: 20px; }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--raised-2); }
.track-fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--stage); width: 0; transition: background 0.3s; }
.track-mark { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--line); border-radius: 1px; }
.track-mark span { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--faint); white-space: nowrap; }
.track-wrap { padding-bottom: 14px; }
.rest.idle .rest-clock { font-size: 30px; }
.rest.overdue { animation: overdue 1.2s infinite; }
@keyframes overdue { 50% { border-color: transparent; } }

/* sheets */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / 0.6); display: flex; align-items: flex-end; justify-content: center; animation: fade 0.18s ease-out; }
.sheet {
  width: 100%; max-width: 480px; background: var(--raised); border-radius: 24px 24px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto;
  animation: rise 0.22s cubic-bezier(.2,.8,.2,1);
}
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head h2 { font-size: 19px; font-weight: 600; }
.delta { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--raised-2); color: var(--dim); white-space: nowrap; }
.delta.up { color: var(--green); background: color-mix(in srgb, var(--green) 15%, var(--raised)); }
.delta.down { color: var(--orange); background: color-mix(in srgb, var(--orange) 15%, var(--raised)); }

/* wheel */
.wheel-area { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; }
.fine { width: 44px; height: 44px; border-radius: 50%; background: var(--raised-2); font-weight: 600; font-size: 20px; color: var(--dim); }
.wheel {
  position: relative; width: 100%; max-width: 290px; aspect-ratio: 1; justify-self: center;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
}
.wheel svg { width: 100%; height: 100%; display: block; }
.wheel .dial { transform-origin: 150px 150px; }
.wheel-center {
  position: absolute; inset: 27%; border-radius: 50%;
  background: var(--wk); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  box-shadow: 0 0 0 6px var(--raised), 0 8px 24px rgb(0 0 0 / 0.5);
  cursor: pointer;
}
.wheel-center:active { transform: scale(0.96); }
.wheel-center .v { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 0.9; }
.wheel-center .u { font-size: 12px; font-weight: 600; opacity: 0.7; }
.wheel-center .a { margin-top: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: rgb(0 0 0 / 0.14); }
.reps { display: flex; align-items: center; justify-content: center; gap: 14px; }
.reps button { width: 48px; height: 48px; border-radius: 14px; background: var(--raised-2); font-size: 22px; font-weight: 600; }
.reps .rv { min-width: 92px; text-align: center; }
.reps .rv b { font-family: var(--font-display); font-weight: 800; font-size: 32px; display: block; line-height: 1; }
.reps .rv span { font-size: 12px; color: var(--dim); }
.hint { text-align: center; font-size: 12px; color: var(--faint); }

/* settings */
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle { width: 52px; height: 32px; border-radius: 16px; background: var(--raised-2); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--dim); transition: transform 0.2s; }
.toggle.on { background: var(--green); }
.toggle.on::after { transform: translateX(20px); background: var(--chalk); }
.volume { flex: 1; min-width: 0; accent-color: var(--chalk); }
.stage-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.stage-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.stage-row .grow { flex: 1; }
.stage-row .t { font-family: var(--font-display); font-weight: 800; font-size: 22px; width: 52px; }
.play { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--raised-2); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; cursor: pointer; }
.play input, .pick input { display: none; }
.pick {
  height: 52px; border-radius: 14px; background: var(--chalk); color: var(--ink); font-weight: 600; font-size: 16px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.pick:focus-within { outline: 2px solid var(--chalk); outline-offset: 2px; }
.snd-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.snd-row .grow { flex: 1; min-width: 0; }
.snd-row .file { font-size: 12px; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.snd-row .file.none { color: var(--faint); }
.snd-row .file.bad { color: var(--orange); white-space: normal; }
.diag { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 12px; background: var(--floor); font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
.diag b { color: var(--chalk); font-weight: 600; }
.link-btn { font-size: 13px; font-weight: 600; color: var(--dim); padding: 6px 4px; }

/* summary */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--raised); border-radius: 16px; padding: 14px; }
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; }
.stat span { font-size: 12px; color: var(--dim); }
.changes { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.changes .up { color: var(--green); }
.changes .down { color: var(--orange); }

/* history */
.banner { background: var(--raised); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--dim); display: flex; flex-direction: column; gap: 10px; }
.banner button { align-self: flex-start; font-size: 13px; font-weight: 600; color: var(--chalk); padding: 6px 12px; border-radius: 10px; background: var(--raised-2); }
.month-head { display: flex; align-items: center; justify-content: space-between; }
.month-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; text-transform: uppercase; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { font-size: 11px; color: var(--faint); text-align: center; padding-bottom: 4px; font-weight: 600; }
.day {
  aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 14px; color: var(--dim); background: transparent; max-width: 100%;
}
.day.has { background: var(--raised); color: var(--chalk); font-weight: 600; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--chalk); }
.day.sel { background: var(--raised-2); }
.day.out { visibility: hidden; }
.day .dots { display: flex; gap: 3px; height: 8px; }
.day .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.hist-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.hist-row .grow { flex: 1; min-width: 0; }
.hist-row b { font-weight: 600; }
.hist-row .r { text-align: right; font-size: 13px; color: var(--dim); }
.mini-stats { display: flex; gap: 20px; }

/* The lock-screen card (app-shell build 2+): a rest timer and a Log set button that work without unlocking.

const card = native && native.Session ? native.Session : null;
// The sets still to do, in the order Log set takes them (the one on screen, the rest of its exercise,
// then the first unfinished set of the workout), each with the callout logging it here would play.
function upcomingSets() {
  const a = S.active; const w = sessionWorkout();
  const sets = {}; w.exercises.forEach(ex => { sets[ex.id] = a.sets[ex.id].map(s => ({ ...s })); });
  const firstOpen = () => { for (const ex of w.exercises) { const i = sets[ex.id].findIndex(s => !s.done); if (i >= 0) return { exId: ex.id, i }; } return null; };
  let cur = focus && sets[focus.exId] && sets[focus.exId][focus.i] && !sets[focus.exId][focus.i].done ? { exId: focus.exId, i: focus.i } : firstOpen();
  if (cur && focus && cur.exId === focus.exId && cur.i === focus.i) {   // what the wheel shows, even if not applied yet
    sets[cur.exId].forEach((x, j) => { if (j >= cur.i && !x.done) x.weight = focus.weight; });
    sets[cur.exId][cur.i].reps = focus.reps;
  }
  let doneInWorkout = Object.values(sets).flat().filter(s => s.done).length;
  const out = [];
  while (cur) {
    const list = sets[cur.exId]; const s = list[cur.i];
    s.done = true; doneInWorkout++;
    const prev = (S.last[cur.exId] || [])[cur.i];

      doneInWorkout,
      doneInExercise: list.filter(x => x.done).length,
      exerciseFinished: list.every(x => x.done),
      exercisesFinished: w.exercises.filter(e => sets[e.id].every(x => x.done)).length,
      exerciseCount: w.exercises.length,
      beatLast: !!prev && s.weight > prev.weight,

    out.push({
      id: cur.exId + ':' + cur.i,
      title: exById(w, cur.exId).name,
      text: `${fmtWU(s.weight)} × ${s.reps} · set ${cur.i + 1} of ${list.length}`,
      sound: call && S.announcer !== false ? CALLS.find(c => c.name === call).id : '',
      data: { exId: cur.exId, i: cur.i, weight: s.weight, reps: s.reps },
    });

      const uniq = lw ? [...new Set(lw)] : null;
      return `<div class="plan-item"><div><b>${ex.name}</b><div class="meta">${ex.sets} × ${ex.reps}${ex.note ? ' · ' + ex.note : ''}</div>${howTo(ex)}</div>
        <div class="r num">${last ? 'last<br><b style="color:var(--chalk);font-size:15px">' + uniq.join(' / ') + (last[0].weight ? ' kg' : '') + '</b>' : 'start at<br><b style="color:var(--chalk);font-size:15px">' + fmtWU(ex.weight) + '</b>'}</div></div>`;
    }).join('')}
  </div>
  <div class="c-${w.color}">
    <button class="btn btn-primary btn-block" data-act="start" data-w="${w.id}" ${S.active ? 'disabled style="opacity:.4"' : ''}>${S.active ? 'Finish your current workout first' : view.short ? 'Start short workout' : 'Start workout'}</button>
  </div>
  <p class="sample-note">To change exercises, sets or reps, tell Claude.</p>`;
}

function screenSession() {
  ensureFocus();
  const a = S.active; const w = sessionWorkout();
  const cur = currentSet();
  const all = Object.values(a.sets).flat();
  const done = all.filter(s => s.done).length;
  const ex = exById(w, focus.exId); const exIdx = w.exercises.indexOf(ex);
  const sets = a.sets[ex.id]; const s = sets[focus.i];
  const l = (S.last[ex.id] || [])[focus.i];
  const isCurrent = cur && cur.ex.id === ex.id && cur.i === focus.i;
  const eyebrow = s.done ? `Set ${focus.i + 1} of ${ex.sets} · logged` : isCurrent ? `${a.lastLogAt ? 'Next up' : 'First up'} · set ${focus.i + 1} of ${ex.sets}` : `Looking ahead · set ${focus.i + 1} of ${ex.sets}`;

  // what comes after the focused set
  const queue = [];
  const restHere = sets.filter((x, j) => !x.done && j > focus.i);
  if (restHere.length) queue.push(`<div class="up-row same"><span class="grow"><b>${restHere.length} more ${restHere.length === 1 ? 'set' : 'sets'}</b> <span class="meta">of ${ex.name}</span></span><span class="r num">${fmtW(restHere[0].weight)}${restHere[0].weight ? '<small> kg</small>' : ''}</span></div>`);
  w.exercises.slice(exIdx + 1).concat(w.exercises.slice(0, exIdx)).forEach(e => {
    const left = a.sets[e.id].filter(x => !x.done);
    if (!left.length || queue.length >= 4) return;
    queue.push(`<button class="up-row" data-act="focus-ex" data-ex="${e.id}"><span class="grow"><b>${e.name}</b><br><span class="meta num">${left.length < e.sets ? left.length + ' of ' + e.sets + ' sets left' : e.sets + ' × ' + e.reps}${e.note ? ' · ' + e.note : ''}</span></span><span class="r num">${fmtW(left[0].weight)}${left[0].weight ? '<small> kg</small>' : ''}</span><span class="chev">${ICON.chev}</span></button>`);
  });

  return `
  <div class="session-bar">
    <button class="icon-btn" data-act="home" aria-label="Back to workouts">${ICON.back}</button>
    <div class="grow"><h1>${w.name}</h1><div class="meta num">${a.short ? 'Short · ' : ''}<span id="elapsed">${fmtClock(Date.now() - a.start)}</span> · ${done}/${all.length} sets</div></div>
    <button class="icon-btn" data-act="overview" aria-label="See all sets">${ICON.list}</button>
    <button class="finish-btn" data-act="finish">Finish</button>
  </div>
  <div class="strip-wrap">
    <div class="strip">${w.exercises.map(e => {
      const n = a.sets[e.id].filter(x => x.done).length;
      return `<button class="seg ${e.id === ex.id ? 'on' : ''}" style="--n:${e.sets}" data-act="focus-ex" data-ex="${e.id}" aria-label="${e.name}"><i><b style="width:${n / e.sets * 100}%"></b></i></button>`;
    }).join('')}</div>
    <div class="strip-meta"><span>Exercise ${exIdx + 1} of ${w.exercises.length}</span><span>Tap the bar to look ahead</span></div>
  </div>
  ${!cur ? `<div class="all-done"><span class="grow"><b>All ${all.length} sets done</b><br><span class="meta">Nice work. Save it to your history.</span></span><button class="btn btn-primary" style="--c:var(--wk);height:44px" data-act="finish">Finish</button></div>` : ''}
  <section class="focus">
    <div>
      <div class="eyebrow focus-eyebrow ${isCurrent || s.done ? '' : 'ahead'}">${eyebrow}</div>
      <h1 class="focus-name">${ex.name}</h1>
    </div>
    <div class="focus-meta">
      ${sets.map((x, j) => `<button class="sdot ${x.done ? 'done' : ''} ${j === focus.i ? 'sel' : ''}" data-act="focus-set" data-ex="${ex.id}" data-i="${j}" aria-label="Set ${j + 1}${x.done ? ', logged' : ''}">${x.done ? ICON.check.replace('<svg', '<svg width="16" height="16"') : j + 1}</button>`).join('')}
      ${howTo(ex)}
    </div>
    <div class="focus-last num"><span>${l ? `Last time <b>${fmtWU(l.weight)} × ${l.reps}</b>` : 'First time doing this one'}${ex.note ? ' · ' + ex.note : ''}</span><span class="delta" id="delta"></span></div>
    ${wheelMarkup(ex, s.done ? 'Update' : 'Log set')}
    <div class="reps">
      <button data-act="reps" data-dir="-1" aria-label="One rep fewer">−</button>
      <div class="rv"><b class="num" id="reps-v">${focus.reps}</b><span>reps</span></div>
      <button data-act="reps" data-dir="1" aria-label="One rep more">+</button>
    </div>
    <div class="focus-links">
      ${!isCurrent && cur ? `<button class="chip-btn accent" data-act="focus-current">Back to ${cur.ex.id === ex.id ? 'set ' + (cur.i + 1) : cur.ex.name}</button>` : ''}
      ${s.done ? `<button class="chip-btn" data-act="undo">Unmark this set</button>` : ''}
    </div>
    <div class="hint">Spin the ring to change weight (${ex.step} kg per click). Tap the centre to ${s.done ? 'save the change' : 'log the set and start the rest clock'}.</div>
  </section>
  ${queue.length ? `<div class="upnext"><div class="eyebrow">Coming up</div>${queue.join('')}</div>` : ''}`;
}

function wheelMarkup(ex, action) {
  const ticks = [];
  for (let k = 0; k < 72; k++) {
    const major = k % 3 === 0; const ang = k * 5 * Math.PI / 180;
    const r1 = major ? 118 : 124, r2 = 136;
    ticks.push(`<line x1="${150 + r1 * Math.sin(ang)}" y1="${150 - r1 * Math.cos(ang)}" x2="${150 + r2 * Math.sin(ang)}" y2="${150 - r2 * Math.cos(ang)}" stroke="${major ? 'var(--dim)' : 'var(--faint)'}" stroke-width="${major ? 3 : 1.5}" stroke-linecap="round"/>`);
  }
  return `
  <div class="wheel-area">
    <button class="fine" data-act="fine" data-dir="-1" aria-label="Decrease by ${ex.step} kg">−</button>
    <div class="wheel" id="wheel">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <circle cx="150" cy="150" r="146" fill="var(--raised)"/>
        <circle cx="150" cy="150" r="146" fill="none" stroke="var(--line)" stroke-width="2"/>
        <g class="dial" id="dial">${ticks.join('')}</g>
        <path d="M150 4 l-9 -0.5 l9 15 l9 -15 z" fill="var(--wk)"/>
      </svg>
      <button class="wheel-center" data-act="apply" id="wheel-apply">
        <span class="v num" id="wheel-v">${fmtW(focus.weight)}</span>
        <span class="u" id="wheel-u">${unitLabel(focus.weight)}</span>
        <span class="a">${action}</span>
      </button>
    </div>
    <button class="fine" data-act="fine" data-dir="1" aria-label="Increase by ${ex.step} kg">+</button>
  </div>`;
}

function screenSummary() {
  const { sess, prevLast } = view.summary; const w = byId(sess.workoutId);
  const vol = sess.sets.reduce((n, s) => n + Math.max(0, s.weight) * s.reps, 0);
  const rests = sess.sets.map(s => s.rest).filter(Boolean);
  const avgRest = rests.length ? rests.reduce((a, b) => a + b, 0) / rests.length : 0;
  const changes = [];
  w.exercises.forEach(ex => {
    const now = sess.sets.filter(s => s.exId === ex.id);
    const before = prevLast[ex.id];
    if (!now.length || !before) return;
    const maxNow = Math.max(...now.map(s => s.weight)), maxBefore = Math.max(...before.map(s => s.weight));
    if (maxNow !== maxBefore) changes.push({ name: ex.name, diff: maxNow - maxBefore, to: maxNow });
  });
  return `
  <div class="hero c-${w.color}" style="padding-top:12px"><span class="plate lg"></span><div><div class="eyebrow">Saved to history</div><h1>${w.name}</h1><div class="meta">${fmtDate(sess.start)} · ${fmtTime(sess.start)}–${fmtTime(sess.end)}</div></div></div>
  <div class="stats">
    <div class="stat"><b class="num">${fmtDur(sess.end - sess.start)}</b><span>Duration</span></div>
    <div class="stat"><b class="num">${sess.sets.length}</b><span>Sets logged</span></div>
    <div class="stat"><b class="num">${Math.round(vol).toLocaleString('en-GB')}</b><span>Volume, kg × reps</span></div>
    <div class="stat"><b class="num">${rests.length ? fmtClock(avgRest) : '–'}</b><span>Average rest</span></div>
  </div>
  ${changes.length ? `<div class="stack"><div class="eyebrow">Weight changes vs last time</div><div class="changes">${changes.map(c => `<div class="${c.diff > 0 ? 'up' : 'down'}">${c.diff > 0 ? '▲' : '▼'} ${c.name}: ${fmtWU(c.to)} (${c.diff > 0 ? '+' : '−'}${fmtW(Math.abs(c.diff))} kg)</div>`).join('')}</div></div>` : ''}
  <button class="btn btn-ghost btn-block" data-act="home">Done</button>`;
}

function screenHistory() {
  const now = new Date();
  if (!view.month) {
    const latest = [...S.history].sort((a, b) => b.start - a.start)[0];
    const ref = latest && new Date(latest.start).getMonth() !== now.getMonth() && !S.history.some(h => new Date(h.start).getMonth() === now.getMonth() && new Date(h.start).getFullYear() === now.getFullYear()) ? new Date(latest.start) : now;
    view.month = { y: ref.getFullYear(), m: ref.getMonth() };
  }
  const { y, m } = view.month;
  const inMonth = S.history.filter(h => { const d = new Date(h.start); return d.getFullYear() === y && d.getMonth() === m; }).sort((a, b) => b.start - a.start);
  const questsIn = (S.questLog || []).filter(q => { const d = new Date(q.start); return d.getFullYear() === y && d.getMonth() === m; });
  const first = new Date(y, m, 1); const offset = (first.getDay() + 6) % 7; // Monday first
  const nDays = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push('<span class="day out"></span>');
  for (let d = 1; d <= nDays; d++) {
    const sess = inMonth.filter(h => new Date(h.start).getDate() === d);
    const qs = questsIn.filter(q => new Date(q.start).getDate() === d);
    const isToday = now.getFullYear() === y && now.getMonth() === m && now.getDate() === d;
    const sel = view.selDay === d;
    const any = sess.length + qs.length;
    cells.push(`<button class="day ${any ? 'has' : ''} ${isToday ? 'today' : ''} ${sel ? 'sel' : ''}" data-act="day" data-d="${d}" ${any ? '' : 'tabindex="-1"'}>
      <span class="num">${d}</span><span class="dots">${sess.map(s => `<i class="c-${byId(s.workoutId).color}"></i>`).join('')}${qs.map(() => '<i class="qdot">!</i>').join('')}</span></button>`);
  }
  const onDay = h => !view.selDay || new Date(h.start).getDate() === view.selDay;
  const list = [...inMonth.filter(onDay), ...questsIn.filter(onDay).map(q => ({ ...q, quest: true }))].sort((a, b) => b.start - a.start);
  // workouts per week over the last 4 weeks
  const fourWk = S.history.filter(h => h.start > Date.now() - 28 * 86400000).length;
  return `
  <div class="topbar"><div class="brand">History</div></div>
  ${S.sample && S.history.some(h => h.sample) ? `<div class="banner">These October sessions are examples so you can see how the calendar looks. Workouts you log appear here too.<button data-act="clear-sample">${clearArmed ? 'Tap again to remove examples' : 'Remove example sessions'}</button></div>` : ''}
  <div class="mini-stats">
    <div><b class="num">${inMonth.length}</b><span>Workouts in ${MONTHS[m]}</span></div>
    <div><b class="num">${(fourWk / 4).toFixed(1)}</b><span>Per week, last 4 weeks</span></div>
  </div>
  <div class="month-head">
    <button class="icon-btn" data-act="month" data-dir="-1" aria-label="Previous month">${ICON.back}</button>
    <h2>${MONTHS[m]} ${y}</h2>
    <button class="icon-btn" data-act="month" data-dir="1" aria-label="Next month">${ICON.chev}</button>
  </div>
  <div class="cal">
    ${['M','T','W','T','F','S','S'].map(d => `<span class="dow">${d}</span>`).join('')}
    ${cells.join('')}
  </div>
  <div class="legend">${PLAN.map(w => `<span><i class="c-${w.color}"></i>${w.name}</span>`).join('')}<span><i class="qdot">!</i>Quest mode</span></div>
  <div>
    <div class="eyebrow" style="padding-bottom:4px">${view.selDay ? fmtDate(new Date(y, m, view.selDay)) + ' · <button data-act="day" data-d="' + view.selDay + '" style="color:var(--chalk);letter-spacing:inherit;text-transform:inherit;font-size:inherit;font-weight:inherit">Show whole month</button>' : 'Sessions this month'}</div>
    ${list.length ? list.map(h => { if (h.quest) return `
      <button class="hist-row" data-act="q-detail" data-id="${h.id}">
        ${qMarker('!', 22)}
        <span class="grow"><b>Quest mode</b><br><span class="meta">${fmtDate(h.start)} · started ${fmtTime(h.start)}</span></span>
        <span class="r num">${fmtDur(h.end - h.start)}<br>${h.done} quest${h.done === 1 ? '' : 's'}</span>
      </button>`;
      const w = byId(h.workoutId); return `
      <button class="hist-row" data-act="detail" data-id="${h.id}">
        <span class="plate sm c-${w.color}"></span>
        <span class="grow"><b>${w.name}</b>${h.short ? ' <span class="meta">· short</span>' : ''}<br><span class="meta">${fmtDate(h.start)} · started ${fmtTime(h.start)}</span></span>
        <span class="r num">${fmtDur(h.end - h.start)}<br>${h.sets.length} sets</span>
      </button>`; }).join('') : `<div class="empty">Nothing logged ${view.selDay ? 'on this day' : 'this month'}.</div>`}
  </div>`;
}

function renderDock() {

  } else if (view.screen === 'quests' && S.quest) {

}
function updateRest() {
  const a = S.active;
  const el = $('#rest'); if (!el || !a) return;
  const ll = a.lastLog;
  $('#rest-next').innerHTML = ll ? `since <b>${exById(byId(a.workoutId), ll.exId).name}</b>, set ${ll.i + 1}` : '';
  const elapsed = $('#elapsed'); if (elapsed) elapsed.textContent = fmtClock(Date.now() - a.start);
  if (!a.lastLogAt) {
    el.classList.add('idle'); $('#rest-clock').textContent = 'Go';
    $('#rest-label').textContent = 'Clock starts when you log a set';
    return;
  }
  el.classList.remove('idle');
  const ms = Date.now() - a.lastLogAt; const sec = ms / 1000;
  let stage = null; STAGES.forEach(s => { if (sec >= s.t) stage = s; });
  $('#rest-clock').textContent = fmtClock(ms);
  $('#rest-label').textContent = stage ? stage.label : 'Resting';
  el.style.setProperty('--stage', stage ? stage.color : 'var(--chalk)');
  el.classList.toggle('overdue', !!stage && stage.t === 180);
  $('#track-fill').style.width = Math.min(100, sec / TRACK_MAX * 100) + '%';
  STAGES.forEach(s => {
    if (sec >= s.t && !a.fired.includes(s.t)) {
      a.fired.push(s.t);
      if (sec < s.t + 3) playStage(s.sound);  // don't replay old alerts when reopening the app
      save();
    }
  });
}
setInterval(updateRest, 250);

/* ---------- sheets ---------- */
function renderSheet() {
  const root = $('#sheet-root');
  if (!sheet) { root.innerHTML = ''; return; }
  let inner = '';
  if (sheet.type === 'overview') inner = sheetOverview();
  if (sheet.type === 'finish') inner = sheetFinish();
  if (sheet.type === 'settings') inner = sheetSettings();
  if (sheet.type === 'detail') inner = sheetDetail();
  if (sheet.type === 'sounds') inner = sheetSounds();
  if (sheet.type === 'q-end') inner = qSheetEnd();
  if (sheet.type === 'q-detail') inner = qSheetDetail();
  const wk = S.active ? byId(S.active.workoutId).color : null;
  root.innerHTML = `<div class="backdrop" data-act="close-sheet"><div class="sheet" ${wk ? `style="--wk:var(--${wk})"` : ''} role="dialog" aria-modal="true">
    <span class="grabber"></span>${inner}</div></div>`;
}

function bindWheel() {
  const a = S.active; const ex = exById(byId(a.workoutId), focus.exId);
  const l = (S.last[ex.id] || [])[focus.i];
  const wheel = $('#wheel'), dial = $('#dial');
  const DEG = 15; // one click per 15° of rotation
  let dragging = false, lastAng = 0, acc = 0, base = focus.weight, steps = 0;
  const angleOf = e => { const r = wheel.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  const paint = () => {
    $('#wheel-v').textContent = fmtW(focus.weight);
    $('#wheel-u').textContent = unitLabel(focus.weight);
    $('#reps-v').textContent = focus.reps;
    const d = $('#delta');
    if (l) { const diff = +(focus.weight - l.weight).toFixed(2); d.className = 'delta ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : ''); d.textContent = diff === 0 ? 'Same as last' : (diff > 0 ? '+' : '−') + fmtW(Math.abs(diff)) + ' kg'; }
    else d.textContent = '';
  };
  focus.paint = paint; focus.spin = deg => { focus.rot = (focus.rot || 0) + deg; dial.style.transform = `rotate(${focus.rot}deg)`; };
  dial.style.transform = `rotate(${focus.rot || 0}deg)`;
  paint();
  wheel.addEventListener('pointerdown', e => {
    if (e.target.closest('.wheel-center')) return;
    dragging = true; lastAng = angleOf(e); acc = 0; base = focus.weight; steps = 0;
    wheel.setPointerCapture(e.pointerId); ensureAudio();
  });
  wheel.addEventListener('pointermove', e => {
    if (!dragging) return;
    const ang = angleOf(e); let d = ang - lastAng;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    lastAng = ang; acc += d; focus.spin(d);
    const n = Math.round(acc / DEG);
    if (n !== steps) {
      const v = +(base + n * ex.step).toFixed(2);
      if (v !== focus.weight) { focus.weight = v; tick(); paint(); }
      steps = n;
    }
  });
  const end = () => { dragging = false; };
  wheel.addEventListener('pointerup', end); wheel.addEventListener('pointercancel', end);
}

function sheetSettings() {
  return `
  <div class="sheet-head"><div><h2>Settings</h2><div class="meta">The rest clock starts the moment you log a set.</div></div></div>
  <div class="setting"><span>Play sounds</span><button class="toggle ${S.sound ? 'on' : ''}" data-act="toggle-sound" aria-label="Toggle sounds"></button></div>

    ${STAGES.map(s => `<div class="stage-row"><span class="stage-dot" style="background:${s.color}"></span><span class="t num">${fmtClock(s.t * 1000)}</span><span class="grow meta">${s.label}</span><button class="play" data-act="play" data-s="${s.sound}">Play</button></div>`).join('')}
  </div>
  <div class="setting"><span>Announcer on finished sets<br><span class="meta">Prepare for Battle at the start, First Blood on your first set, Double and Triple Kill on an exercise's 2nd and 3rd set, Headshot when you beat last time's weight, Multi Kill … Godlike when you finish an exercise, Flawless Victory when you finish every set</span></span><button class="toggle ${S.announcer !== false ? 'on' : ''}" data-act="toggle-announcer" aria-label="Toggle announcer"></button></div>
  <button class="setting" style="width:100%;text-align:left" data-act="sounds"><span>Announcer sounds<br><span class="meta">${Object.keys(custom).length ? Object.keys(custom).length + ' of ' + CALLS.length + ' are your own files' : 'Using the phone voice. Add your own files'}</span></span><span class="chev">${ICON.chev}</span></button>
  <p class="sample-note">Times and sounds are placeholders. Tell Claude what you want.</p>
  <div class="stack">
    <div class="eyebrow">Backup</div>
    <p class="sample-note">Your workouts live on this phone. Save a backup file now and then, so a new phone or cleared app data doesn't lose them.</p>
    <button class="btn btn-ghost btn-block" data-act="export">Save backup file</button>
    <label class="btn btn-ghost btn-block" style="cursor:pointer">Restore from backup<input type="file" accept="application/json,.json" id="backup-file" hidden></label>
  </div>
  <button class="btn btn-danger btn-block" data-act="reset">${sheet.armed ? 'Tap again to delete all workouts' : 'Delete all workout data'}</button>`;
}

function fileLabel(id) {
  const list = custom[id];
  if (!list) return '<span class="file none">phone voice</span>';
  const ok = list.filter(t => t.buf).length, bad = list.filter(t => t.err);
  if (bad.length === list.length) return `<span class="file bad">couldn't read ${esc(bad[0].name)} (${esc(bad[0].err)})</span>`;
  if (!ok) return '<span class="file none">reading…</span>';
  return `<span class="file">${list.length === 1 ? esc(list[0].name) : ok + ' takes, rotating'}${bad.length ? ` · ${bad.length} unreadable` : ''}</span>`;
}

function sheetSounds() {
  const n = Object.keys(custom).length;
  return `
  <div class="sheet-head"><div><h2>Announcer sounds</h2><div class="meta">Pick your audio files and they're matched by file name, e.g. <b>first_blood.wav</b> or <b>Godlike.mp3</b>. Several takes of one callout (doublekill.mp3, doublekill2.mp3…) rotate at random. Callouts without a file use the phone voice.</div></div></div>
  <label class="pick">Choose sound files<input type="file" accept="audio/*" multiple data-sound-input id="sound-files"></label>
  <p class="sample-note" style="color:${!n ? 'var(--faint)' : soundsSaved ? 'var(--green)' : 'var(--orange)'}">${!n ? 'No files loaded yet. Every callout uses the phone voice.' : `${Object.values(custom).flat().length} files loaded for ${n} of ${CALLS.length} callouts. ` + (soundsSaved ? 'Saved on this phone.' : 'This browser won\'t save them, so load them again next time you open the page.')}</p>
  <div>
    ${CALLS.map(c => `<div class="snd-row">
      <span class="grow"><b>${c.name}</b>${fileLabel(c.id)}</span>
      <button class="play" data-act="hear" data-t="${c.name}">Play</button>
      <label class="play">${custom[c.id] ? '+ Take' : 'Add'}<input type="file" accept="audio/*" data-sound-input data-call="${c.id}" id="snd-${c.id}"></label>
      ${custom[c.id] ? `<button class="link-btn" data-act="remove-sound" data-call="${c.id}" aria-label="Remove ${c.name} files">✕</button>` : ''}
    </div>`).join('')}
  </div>
  <p class="sample-note">The clips download to this phone the first time the app opens, from <a href="${SOUND_REPO}" target="_blank" rel="noopener" style="color:var(--dim)">this GitHub repo</a>, and then work offline. Files you add yourself stay on this phone too. The rest-clock beeps are built in.</p>
  <button class="btn btn-ghost btn-block" data-act="redownload">Download the clips again</button>
  <div class="diag num">
    <b>Diagnostics · ${BUILD}</b>
    <span>Last pick: ${esc(diag.pick)}</span>
    <span>Loaded: ${Object.values(custom).flat().filter(t => t.buf).length} ready, ${Object.values(custom).flat().filter(t => t.err).length} unreadable, ${Object.values(custom).flat().filter(t => !t.buf && !t.err).length} reading</span>
    <span>Saved files: ${esc(diag.load)}</span>
    <span>Last callout: ${esc(diag.play)}</span>
    <span>Sounds ${S.sound ? 'on' : 'muted'} · audio engine ${audio ? audio.state : 'not started'}</span>
    <span>Running in: ${card ? 'Plate Log Android app (lock-screen card on)' : native ? 'Plate Log Android app, older version (reinstall for the lock-screen card)' : 'browser'}</span>
  </div>
  <button class="btn btn-ghost btn-block" data-act="settings">Back</button>`;
}

function sheetDetail() {
  const h = S.history.find(x => x.id === sheet.id); const w = byId(h.workoutId);
  return `
  <div class="sheet-head c-${w.color}" style="justify-content:flex-start"><span class="plate"></span><div><h2>${w.name}</h2><div class="meta">${fmtDate(h.start)} · ${fmtTime(h.start)}–${fmtTime(h.end)} · ${fmtDur(h.end - h.start)}${h.short ? ' · short' : ''}</div></div></div>
  <div>
  ${w.exercises.map(ex => {
    const sets = h.sets.filter(s => s.exId === ex.id);
    if (!sets.length) return '';
    const rests = sets.map(s => s.rest).filter(Boolean);
    return `<div class="detail-ex"><b>${ex.name}</b><span class="sets num">${sets.map(s => fmtW(s.weight) + ' × ' + s.reps).join('  ·  ')}${rests.length ? '<br>rest ' + rests.map(fmtClock).join(', ') : ''}</span></div>`;
  }).join('')}
  </div>`;
}

/* ---------- render + events ---------- */
function render() {
  const app = $('#app');
  const wk = S.active && view.screen === 'session' ? byId(S.active.workoutId).color : null;
  document.documentElement.style.setProperty('--wk', wk ? `var(--${wk})` : 'var(--chalk)');
  app.innerHTML = { home: screenHome, preview: screenPreview, session: screenSession, summary: screenSummary, history: screenHistory, quests: screenQuests, 'quest-summary': screenQuestSummary }[view.screen]();
  if (view.screen === 'session' && S.active) bindWheel();
  renderDock(); renderSheet();
  syncCard();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'close-sheet') { if (e.target !== t) return; sheet = null; renderSheet(); return; }
  e.stopPropagation();
  switch (act) {
    case 'home': view.screen = 'home'; clearArmed = false; render(); scrollTo(0, 0); break;
    case 'history': view.screen = 'history'; view.selDay = null; render(); scrollTo(0, 0); break;
    case 'preview': view.screen = 'preview'; view.workoutId = t.dataset.w; render(); scrollTo(0, 0); break;
    case 'start': if (S.quest) toast('End quest mode first'); else if (!S.active) { startWorkout(t.dataset.w, view.short); scrollTo(0, 0); } break;
    case 'len': view.short = t.dataset.short === '1'; render(); break;
    case 'resume': view.screen = 'session'; keepAwake(); render(); break;
    case 'undo': undoSet(focus.exId, focus.i); break;
    case 'apply': ensureAudio(); logSet(focus.exId, focus.i, focus.weight, focus.reps); break;
    case 'fine': { const ex = exById(byId(S.active.workoutId), focus.exId); focus.weight = +(focus.weight + (+t.dataset.dir) * ex.step).toFixed(2); focus.spin(+t.dataset.dir * 15); tick(); focus.paint(); break; }
    case 'reps': focus.reps = Math.max(0, focus.reps + (+t.dataset.dir)); focus.paint(); break;
    case 'focus-ex': focusExercise(t.dataset.ex); sheet = null; render(); scrollTo(0, 0); break;
    case 'focus-set': setFocus(t.dataset.ex, +t.dataset.i); render(); break;
    case 'focus-current': { const c = currentSet(); if (c) setFocus(c.ex.id, c.i); render(); scrollTo(0, 0); break; }
    case 'overview': sheet = { type: 'overview' }; renderSheet(); break;
    case 'finish': sheet = { type: 'finish' }; renderSheet(); break;
    case 'finish-yes': finishWorkout(); scrollTo(0, 0); break;
    case 'discard': if (sheet.armed) discardWorkout(); else { sheet.armed = true; renderSheet(); } break;
    case 'settings': sheet = { type: 'settings' }; renderSheet(); break;
    case 'toggle-sound': S.sound = !S.sound; save(); ensureAudio(); renderDock(); if (sheet) renderSheet(); toast(S.sound ? 'Sounds on' : 'Sounds muted'); break;
    case 'play': playStage(t.dataset.s, true); break;
    case 'export': exportBackup(); break;
    case 'toggle-announcer': S.announcer = S.announcer === false; save(); renderSheet(); toast(S.announcer ? 'Announcer on' : 'Announcer off'); break;
    case 'sounds': sheet = { type: 'sounds' }; renderSheet(); break;
    case 'redownload': toast('Downloading…'); downloadSounds(true); break;
    case 'remove-sound': removeSound(t.dataset.call).then(renderSheet); break;
    case 'hear': { const was = [S.sound, S.announcer]; S.sound = true; S.announcer = true; announce(t.dataset.t, GOLD.includes(t.dataset.t)); [S.sound, S.announcer] = was; if (sheet && sheet.type === 'sounds') renderSheet(); break; }
    case 'reset': if (sheet.armed) { try { localStorage.removeItem(KEY); } catch (err) {} S = fresh(); save(); sheet = null; view = { screen: 'home', month: null, selDay: null }; render(); toast('All workout data deleted'); } else { sheet.armed = true; renderSheet(); } break;
    case 'month': { let { y, m } = view.month; m += +t.dataset.dir; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } view.month = { y, m }; view.selDay = null; render(); break; }
    case 'day': { const d = +t.dataset.d; view.selDay = view.selDay === d ? null : d; render(); break; }
    case 'detail': sheet = { type: 'detail', id: t.dataset.id }; renderSheet(); break;
    case 'clear-sample':
      if (clearArmed) { S.history = S.history.filter(h => !h.sample); S.sample = false; rebuildLast(S); save(); clearArmed = false; view.month = null; render(); toast('Example sessions removed'); }
      else { clearArmed = true; render(); }
      break;
    default: qHandle(act, t);
  }
});

render();
// Offline support: the app keeps working at the gym without signal, and picks up new versions when online.
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
